<!doctype html>
<html lang="en">
<head>

  <meta name="robots" content="noindex, nofollow">
  <title>Diadoku: Same puzzle. Who's faster?</title>
  <meta name="description" content="Race an opponent on the same logic puzzle. One diamond per row, column and color. Free on iPhone and iPad.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css?v=3">
  <style>
    .landing {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      min-height: 100svh; padding: 16px 20px 16px; text-align: center; text-decoration: none;
    }
    .landing h1 { margin: 0; font-family: var(--rounded); font-weight: 900; font-size: clamp(22px, 6.2vw, 34px); line-height: 1.15; }
    .landing .clip {
      display: block; width: min(72%, 280px); height: auto; border-radius: 22px; background: #f4efe9;
      box-shadow: 0 14px 32px var(--shadow); pointer-events: none;
    }
    .landing .cta {
      display: flex; align-items: center; justify-content: center; gap: 12px; width: min(100%, 360px); padding: 15px 24px; border-radius: 18px;
      background: #000; color: #fff; box-shadow: 0 12px 28px rgb(0 0 0 / 24%);
    }
    .landing .cta svg { width: 34px; height: 34px; fill: #fff; flex: none; }
    .landing .cta span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
    .landing .cta small { font-family: var(--sans); font-weight: 500; font-size: 13px; opacity: .85; }
    .landing .cta strong { font-family: var(--rounded); font-weight: 900; font-size: 25px; }
    .landing .lead { margin: 0; max-width: 32ch; font-size: 15px; line-height: 1.4; color: var(--muted); }
    .landing-footer { display: flex; justify-content: center; gap: 18px; padding: 0 20px 28px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <a class="landing" href="https://apps.apple.com/app/apple-store/id6808338155?pt=129407361&amp;ct=fb-ads-en&amp;mt=8">
    <h1>Same puzzle. One opponent.<br>Who's faster?</h1>
    <video class="clip" src="/assets/play/duel-loop.mp4" poster="/assets/play/duel-poster.webp" width="520" height="728" autoplay muted loop playsinline preload="auto" aria-label="A duel on the same board, won at the last diamond"></video>
    <span class="cta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5a4.3 4.3 0 0 0-3.4-1.8c-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8a4.5 4.5 0 0 0-3.8 2.3c-1.6 2.8-.4 6.9 1.1 9.2.8 1.1 1.6 2.3 2.7 2.2 1.1 0 1.5-.7 2.9-.7s1.8.7 3 .7 2-1.1 2.7-2.3a10 10 0 0 0 1.2-2.5 4 4 0 0 1-2-3.6ZM14.4 6a4.2 4.2 0 0 0 1-3 4.3 4.3 0 0 0-2.8 1.5 4 4 0 0 0-1 2.9 3.6 3.6 0 0 0 2.8-1.4Z"/></svg><span><small>Download on the</small><strong>App Store</strong></span></span>

  </a>
  <footer class="landing-footer">
    <a href="https://www.ogulcanserbest.com/imprint.html">Imprint</a>
    <a href="https://www.ogulcanserbest.com/privacy.html">Privacy</a>
  </footer>
  <script>
    // Pass the ad group's ct (e.g. ?ct=fb-ads-en-b) on to the App Store link; anything else keeps fb-ads-en.
    (function () {
      var ct = new URLSearchParams(location.search).get('ct');
      if (!ct || !/^fb-ads-en(-[a-z0-9]{1,12})?$/.test(ct)) return;
      var link = document.querySelector('.landing');
      link.href = link.href.replace('ct=fb-ads-en', 'ct=' + ct);
    })();
